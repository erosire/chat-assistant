openapi: 3.0.3
info:
  title: Chat Assistant API
  description: AI chat assistant conversation API with create, read, append, and delete operations.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:5000
    description: Local development server
paths:
  /v1/chat-assistant/conversation:
    post:
      operationId: createConversation
      summary: Create a conversation
      description: Creates an empty conversation and returns its identifier for the identified conversation resource.
      responses:
        '201':
          description: Conversation identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationIdResponse'
        '400':
          description: Invalid optional conversation settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/chat-assistant/conversation/{conversation_id}:
    parameters:
      - name: conversation_id
        in: path
        required: true
        description: The conversation identifier returned by collection POST.
        schema:
          type: string
    get:
      operationId: getConversation
      summary: Get a conversation
      responses:
        '200':
          description: Complete conversation record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '404':
          description: Conversation identifier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: addToConversation
      summary: Add a message to a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationPostRequest'
      responses:
        '200':
          description: Updated conversation identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationIdResponse'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conversation identifier was not found.
        '502':
          description: Assistant provider failed; the conversation retains the submitted messages and error.
    delete:
      operationId: deleteConversation
      summary: Delete a conversation
      responses:
        '200':
          description: Deleted conversation identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationIdResponse'
        '404':
          description: Conversation identifier was not found.
components:
  schemas:
    ConversationPostRequest:
      type: object
      properties:
        message:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        model:
          type: string
        systemPrompt:
          type: string
      description: Supply message for a normal turn or messages for an explicit initial history.
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
    ConversationRecord:
      type: object
      required: [conversationId, title, model, status, messageCount, messages, createdAt, updatedAt]
      properties:
        conversationId: { type: string }
        title: { type: string }
        model: { type: string }
        status: { type: string, enum: [complete, error] }
        messageCount: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        error: { type: string }
    ConversationIdResponse:
      type: object
      required: [conversationId]
      properties:
        conversationId: { type: string }
    ConversationResponse:
      type: object
      required: [conversationId, conversation]
      properties:
        conversationId: { type: string }
        conversation:
          $ref: '#/components/schemas/ConversationRecord'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
