openapi: 3.0.3
info:
  title: Chat Assistant API
  description: AI chat assistant collection API with list/read and send operations.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:5000
    description: Local development server
paths:
  /v1/chat-assistant/:
    get:
      operationId: getChats
      summary: List chats or read one chat
      parameters:
        - name: chatId
          in: query
          required: false
          description: When supplied, returns the complete conversation for this identifier.
          schema:
            type: string
      responses:
        '200':
          description: Chat list or complete chat record.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatListResponse'
                  - $ref: '#/components/schemas/ChatResponse'
        '404':
          description: Chat identifier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createChat
      summary: Create a chat or send a follow-up message
      description: Creates or updates a conversation and waits for one assistant response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Completed assistant response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Existing chat identifier was not found.
        '502':
          description: Assistant provider failed; the returned chat record contains the error.
components:
  schemas:
    ChatRequest:
      type: object
      properties:
        chatId:
          type: string
        message:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        model:
          type: string
        systemPrompt:
          type: string
      description: Supply message for a normal turn or messages for an explicit initial history.
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
    ChatSummary:
      type: object
      required: [chatId, title, model, status, messageCount, createdAt, updatedAt]
      properties:
        chatId: { type: string }
        title: { type: string }
        model: { type: string }
        status: { type: string, enum: [complete, error] }
        messageCount: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    ChatRecord:
      allOf:
        - $ref: '#/components/schemas/ChatSummary'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/ChatMessage'
            error: { type: string }
    ChatListResponse:
      type: object
      required: [chats]
      properties:
        chats:
          type: array
          items:
            $ref: '#/components/schemas/ChatSummary'
    ChatResponse:
      type: object
      required: [chatId, chat]
      properties:
        chatId: { type: string }
        chat:
          $ref: '#/components/schemas/ChatRecord'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
