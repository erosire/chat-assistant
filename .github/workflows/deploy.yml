# GitHub Pages deployment for the chat-assistant distribution — the CI
# equivalent of the local `deploy` script (`vite build && gh-pages -d dist`
# in package.json). Every push to main rebuilds the app and publishes dist/
# through the official artifact-based Pages flow (configure-pages →
# upload-pages-artifact → deploy-pages), the same flow that fixed the
# equivalent stale-site problem in distribution/story-generator
# (.github/workflows/deploy.yml, rewritten in commit 97f56a1) and was then
# applied to distribution/comfy-dashboard (.github/workflows/deploy.yml).
#
# This REPLACES the previous publishing mechanism, which used
# peaceiris/actions-gh-pages@v4 to force-push dist/ onto the gh-pages branch
# and relied on the repo's Pages setting "Deploy from a branch" to pick it
# up. Publishing dist/ directly through actions/deploy-pages@v4 does NOT
# depend on the gh-pages branch or on "Deploy from a branch" builds at all,
# so that branch-publishing half is removed from the pipeline entirely.
#
# ONE-TIME REPO SETTING (required, not per-deploy — must be flipped manually
# in the repo UI; current remote setting unknown from here):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# The old gh-pages branch becomes unused once this workflow is in place
# (it no longer receives updates from this workflow).
#
# Dependency notes (unchanged from the previous workflow, plus one addition):
# - Environment constants (host + ports) live in the local src/config.ts —
#   the monorepo's @config/environment package cannot be published to npm.
# - @underload/service is unpublished and only used by server/test code —
#   never by the static Pages build — so it is stripped from package.json
#   below to keep `npm install` free of registry 404s.
# - @underload/dashboard is ALSO unpublished (registry 404), but unlike
#   @underload/service the browser build imports it, so it cannot be stripped.
#   It is vendored as a committed tarball and pointed at with a `file:`
#   specifier at CI time only — see the "Vendored workspace package" step.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# deploy-pages@v4 needs id-token (OIDC) + pages write; checkout needs read.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; new pushes cancel in-flight deploys
# (same concurrency guard story-generator and comfy-dashboard use).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Strip server-only dependency
        run: |
          node <<'EOF'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete manifest.dependencies['@underload/service'];
          fs.writeFileSync('package.json', JSON.stringify(manifest, null, 4) + '\n');
          EOF

      # Vendored workspace package (the reason this step exists at all):
      # @underload/dashboard is a monorepo WORKSPACE package that has never been
      # published to npm (registry answers 404), so `npm install` in this
      # standalone Pages repo cannot resolve the "*" specifier its package.json
      # carries. That specifier must stay "*" for the monorepo — a `file:`
      # dependency would break workspace resolution to the package SOURCE, which
      # is how dev/test/typecheck see it — so the swap happens HERE, at CI time,
      # and nothing is published:
      #   vendor/underload-dashboard-<version>.tgz is a COMMITTED artifact built
      #   from packages/underload/dashboard with `npm pack` after its normal
      #   `npm run build` (the package's "files" field ships dist + src, so dist
      #   has to exist before packing). Regenerate it whenever the dashboard
      #   changes:
      #     cd packages/underload/dashboard && npm run build && npm pack \
      #       --pack-destination ../../distribution/chat-assistant/vendor
      # Reversible by construction: delete this step and the manifest is again
      # byte-identical to the workspace copy. The tarball name is READ from the
      # vendor directory (not hardcoded) so a version bump in the dashboard
      # package.json needs no workflow edit; a missing or duplicated artifact
      # fails the build loudly instead of falling back to a registry lookup.
      - name: Point the unpublished workspace package at the vendored tarball
        run: |
          node <<'EOF'
          const fs = require('fs');
          const VENDORED = 'vendor';
          const PACK_PREFIX = 'underload-dashboard-';
          const tarballs = fs.readdirSync(VENDORED).filter(
              (name) => name.startsWith(PACK_PREFIX) && name.endsWith('.tgz')
          );
          if (tarballs.length !== 1) {
              throw new Error(
                  `Expected exactly one ${PACK_PREFIX}<version>.tgz in ${VENDORED}/, found ` +
                  `${tarballs.length} [${tarballs.join(', ')}]. Regenerate it with \`npm pack\` ` +
                  `in packages/underload/dashboard.`
              );
          }
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          manifest.dependencies['@underload/dashboard'] = `file:${VENDORED}/${tarballs[0]}`;
          fs.writeFileSync('package.json', JSON.stringify(manifest, null, 4) + '\n');
          console.log(`@underload/dashboard -> ${manifest.dependencies['@underload/dashboard']}`);
          EOF

      # --legacy-peer-deps: npm's strict peer resolver crashes with
      # "Cannot read properties of null (reading 'edgesOut')" on this
      # dependency tree (vitest 4 + jsdom peer sets) and aborts the install.
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps

      - name: Build
        run: npm run build

      # Artifact-based Pages publishing (replaces the gh-pages branch push):
      # configure-pages reads/applies repo Pages settings, upload-pages-
      # artifact packages dist/, deploy-pages publishes it in the deploy job.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
