<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0b1418" />
        <meta name="description" content="Chat Assistant — an AI chat workspace." />
        <title>Chat Assistant</title>
        <style>
            /* Document scaffolding ONLY — the workstation skin owns palette,
               typography, form controls and scrollbars (see
               src/dashboard/styles/{tokens,base}.css, scoped to `.station`).
               Everything here is layout plumbing the React tree cannot supply
               before it mounts. */
            /* Height chain so a 100vh station and a 100% #root agree. */
            html,
            body,
            #root {
                height: 100%;
            }
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            /* Both skins exist (ink dark, slate light) and the theme plugin reads
               prefers-color-scheme, so the document hint stays dual. */
            :root {
                color-scheme: light dark;
            }
            body {
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
